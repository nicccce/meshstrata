version: "2"
sql:
  - engine: "sqlite"
    schema: "controller/internal/storage/migrations"
    queries:
      - "controller/internal/storage/queries.sql"
      - "controller/internal/storage/queries/*.sql"
    gen:
      go:
        package: "dbgen"
        out: "controller/internal/storage/dbgen"
        sql_package: "database/sql"
